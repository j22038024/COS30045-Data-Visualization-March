<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Energy Consumption Histogram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/visualisations.css" />
</head>

<body>

    <div class="app-wrapper">

        <!-- Tech filter — top pill row -->
        <div class="filter-row" id="filter-tech-row">
            <button class="pill active" data-group="tech" data-value="all">All</button>
            <!-- dynamically populated by interactions.js -->
        </div>

        <!-- Chart -->
        <div class="chart-wrap">
            <div id="histogram-container">
                <div class="loading-msg" id="loading-msg">Loading<span class="dots">...</span></div>
            </div>
        </div>

        <!-- Size filter — bottom pill row -->
        <div class="filter-row" id="filter-size-row">
            <button class="pill active" data-group="size" data-value="all">All Sizes</button>
            <!-- dynamically populated by interactions.js -->
        </div>

    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip"></div>

    <script src="js/shared-constants.js"></script>
    <script src="js/load-data.js"></script>
    <script src="js/histogram.js"></script>
    <script src="js/interactions.js"></script>

</body>

</html>
